name: Build Buena Vibra Finance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Package production build
        run: tar -czf buena-vibra-finance-dist.tar.gz dist

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: buena-vibra-finance-production
          path: buena-vibra-finance-dist.tar.gz
          retention-days: 14
